name: release

on:
  push:
    tags: ["v*"]

# Never cancel a release half way through publishing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # GitHub release and the dist branch

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      - name: Versions match the tag
        run: bun scripts/release.ts check "$TAG"
      - name: Vet and test
        run: go vet ./... && go test -short ./...
      - name: Build
        run: bun scripts/release.ts build "$TAG"
      - name: Stage
        run: bun scripts/release.ts stage "$TAG"
      - name: Assemble plugin
        run: bun scripts/release.ts plugin "$TAG"
      - name: GitHub release
        run: bun scripts/release.ts github "$TAG"
        env:
          GH_TOKEN: ${{ github.token }}
      # Last: the marketplace serves the dist branch, so plugin users only
      # see this version once everything above succeeded.
      - name: Publish plugin to the dist branch
        run: bun scripts/release.ts push-plugin "$TAG"
